[platformio]
src_dir = .
data_dir = data

[env:lolin32]
platform = espressif32
board = lolin32
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB1
board_build.filesystem = littlefs
board_build.partitions = partitions_custom.csv
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
